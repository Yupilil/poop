<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Какашкометр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#e9f3f1; --grout:#c9dcd8; --brown:#5a3418; --choc:#7b4a22;
  --mustard:#f2b632; --paper:#fffdf6; --ink:#2b1a0c; --red:#d8452f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Rubik',system-ui,sans-serif;color:var(--ink);
  background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:56px 56px;
  padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0) + 24px);
  max-width:480px;margin:0 auto;text-align:center;
}
h1{font-family:'Rubik Mono One',Impact,sans-serif;font-size:26px;margin:22px 0 4px;color:var(--brown);letter-spacing:.5px}
.sub{margin:0 0 14px;font-size:14px;color:#6b5238}
.rank{display:inline-block;background:var(--mustard);color:var(--ink);font-weight:600;font-size:14px;padding:6px 14px;border-radius:99px;border:2px solid var(--ink);transform:rotate(-2deg)}
.total{font-family:'Rubik Mono One',Impact,sans-serif;font-size:84px;line-height:1;margin:14px 0 0;color:var(--brown)}
.total small{display:block;font-family:'Rubik',sans-serif;font-size:15px;color:#6b5238;margin-top:4px}
.btn{
  position:relative;width:210px;height:210px;margin:18px auto 10px;border-radius:50%;
  background:var(--paper);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);
  font-size:112px;line-height:1;cursor:pointer;display:block;padding:0;
  transition:transform .08s,box-shadow .08s;
}
.btn:active,.btn.pop{transform:translateY(8px) scale(.96);box-shadow:0 0 0 var(--ink)}
.cta{font-weight:600;font-size:17px;margin:4px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-family:'Rubik Mono One',Impact,sans-serif;font-size:24px;color:var(--choc)}
.stat span{font-size:12px;color:#6b5238}
.week{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 10px 8px;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:90px;gap:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:#6b5238}
.bar i{display:block;width:100%;background:var(--choc);border-radius:6px 6px 0 0;min-height:3px;transition:height .25s}
.bar em{font-style:normal;font-weight:600;color:var(--ink);margin-bottom:2px}
.bar u{text-decoration:none;margin-top:4px}
.last{font-size:14px;color:#6b5238;margin:0 0 10px}
.undo{background:none;border:0;font:inherit;font-size:14px;color:var(--red);text-decoration:underline;padding:8px;cursor:pointer}
.undo:disabled{opacity:.35}
.float{position:fixed;font-size:34px;pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-140px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.float{animation:none;display:none}.btn{transition:none}}
</style>
</head>
<body>
<h1>Какашкометр</h1>
<p class="sub">Серьёзная статистика для несерьёзных людей</p>
<div class="rank" id="rank">…</div>
<div class="total"><span id="total">0</span><small>раз всего</small></div>

<button class="btn" id="btn" aria-label="Отметить поход">💩</button>
<div class="cta">Нажми, когда сходил(а)</div>

<div class="stats">
  <div class="stat"><b id="today">0</b><span>сегодня</span></div>
  <div class="stat"><b id="week">0</b><span>за 7 дней</span></div>
  <div class="stat"><b id="best">0</b><span>рекорд за день</span></div>
</div>

<div class="week"><div class="bars" id="bars"></div></div>

<p class="last" id="last"></p>
<button class="undo" id="undo">Нажал(а) случайно? Отменить</button>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#e9f3f1'); tg.setBackgroundColor('#e9f3f1'); } catch(e){} }

const KEY = 'poop_v1';
let state = { t: 0, d: {}, l: 0 };

// Хранилище: облако Telegram (синхронизируется между устройствами), запасной вариант — localStorage
function load(cb){
  const done = raw => { try { if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e){} cb(); };
  if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
    tg.CloudStorage.getItem(KEY, (err, v) => done(err ? null : v));
  } else {
    let v = null; try { v = localStorage.getItem(KEY); } catch(e){}
    done(v);
  }
}
function save(){
  const raw = JSON.stringify(state);
  if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
    tg.CloudStorage.setItem(KEY, raw, () => {});
  } else {
    try { localStorage.setItem(KEY, raw); } catch(e){}
  }
}

const pad = n => String(n).padStart(2,'0');
const dayKey = dt => dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const $ = id => document.getElementById(id);

function rankFor(n){
  if (n === 0) return 'Трон ждёт тебя';
  if (n < 10) return 'Новичок унитаза';
  if (n < 50) return 'Любитель туалетной бумаги';
  if (n < 150) return 'Профи фаянсового дела';
  if (n < 500) return 'Мастер санузла';
  return 'Император Трона 👑';
}
function plural(n, a, b, c){
  const m = n % 100, k = n % 10;
  if (m > 10 && m < 20) return c;
  if (k === 1) return a; if (k > 1 && k < 5) return b; return c;
}
function ago(ts){
  if (!ts) return 'Пока ни одного похода. Исправляйся!';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'Последний раз: только что';
  if (min < 60) return 'Последний раз: ' + min + ' мин. назад';
  const h = Math.floor(min / 60);
  if (h < 24) return 'Последний раз: ' + h + ' ' + plural(h,'час','часа','часов') + ' назад';
  const d = Math.floor(h / 24);
  return 'Последний раз: ' + d + ' ' + plural(d,'день','дня','дней') + ' назад';
}

function render(){
  const now = new Date(), today = dayKey(now);
  let week = 0, best = 0, bars = '';
  const names = ['вс','пн','вт','ср','чт','пт','сб'];
  const vals = [];
  for (let i = 6; i >= 0; i--) {
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    vals.push({ n: state.d[dayKey(dt)] || 0, label: names[dt.getDay()] });
  }
  const max = Math.max(1, ...vals.map(v => v.n));
  vals.forEach(v => {
    week += v.n;
    bars += '<div class="bar"><em>' + (v.n || '') + '</em><i style="height:' + Math.round(v.n / max * 62) + 'px"></i><u>' + v.label + '</u></div>';
  });
  Object.values(state.d).forEach(v => { if (v > best) best = v; });
  $('total').textContent = state.t;
  $('today').textContent = state.d[today] || 0;
  $('week').textContent = week;
  $('best').textContent = best;
  $('rank').textContent = rankFor(state.t);
  $('bars').innerHTML = bars;
  $('last').textContent = ago(state.l);
  $('undo').disabled = !(state.d[today] > 0);
}

function prune(){
  const keys = Object.keys(state.d).sort();
  while (keys.length > 90) delete state.d[keys.shift()];
}

function burst(x, y){
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = ['💩','💩','🧻','💨','🚽'][Math.floor(Math.random() * 5)];
  el.style.left = (x - 17 + (Math.random() * 80 - 40)) + 'px';
  el.style.top = (y - 17) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

$('btn').addEventListener('click', e => {
  const k = dayKey(new Date());
  state.d[k] = (state.d[k] || 0) + 1;
  state.t += 1; state.l = Date.now();
  prune(); save(); render();
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + 40);
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('heavy'); } catch(_){}
});

$('undo').addEventListener('click', () => {
  const k = dayKey(new Date());
  if (!(state.d[k] > 0)) return;
  state.d[k] -= 1; state.t = Math.max(0, state.t - 1);
  if (state.d[k] === 0) delete state.d[k];
  save(); render();
});

load(render);
setInterval(() => { $('last').textContent = ago(state.l); }, 30000);
</script>
</body>
</html>
